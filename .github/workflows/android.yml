name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04   # has the Android SDK preinstalled
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6   # Chaquopy needs a build-machine Python of the same version
        with:
          python-version: "3.11"
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Signing key from secrets (optional until phase F)
        env:
          KEY_B64: ${{ secrets.HYPOLAB_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/hypolab.jks"
            echo "HYPOLAB_KEYSTORE=$RUNNER_TEMP/hypolab.jks" >> "$GITHUB_ENV"
          else
            echo "No permanent key yet: signing with a throwaway debug key."
          fi
      - name: Build APK
        env:
          HYPOLAB_STORE_PASSWORD: ${{ secrets.HYPOLAB_STORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report the error as an annotation
        if: failure()
        run: |
          f="$RUNNER_TEMP/build.log"
          [ -f "$f" ] || exit 0
          msg=$( (grep -n -i -A3 "what went wrong\|error:\|exception\|failed" "$f" | head -60; echo ---; tail -40 "$f") | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=build::$msg"
      - name: Rename
        run: |
          V=$(grep versionName android/app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          cp android/app/build/outputs/apk/release/app-release.apk "hypolab-$V.apk"
          ls -la *.apk
      - name: Show which key signed the APK
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          FP=$("$AS" verify --print-certs hypolab-*.apk | grep -m1 "SHA-256" | sed 's/.*: //')
          echo "::notice title=signer::SHA-256 $FP"
          if [ -n "$HYPOLAB_KEYSTORE" ] && [ -z "$FP" ]; then echo "::error::could not read the signer"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: hypolab-apk
          path: hypolab-*.apk
          retention-days: 30
