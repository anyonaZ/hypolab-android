name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5   # Chaquopy needs a build-machine Python of the same version
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Signing key from secrets (optional until phase F)
        env:
          KEY_B64: ${{ secrets.HYPOLAB_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/hypolab.jks"
            echo "HYPOLAB_KEYSTORE=$RUNNER_TEMP/hypolab.jks" >> "$GITHUB_ENV"
          else
            echo "No permanent key yet: signing with a throwaway debug key."
          fi
      - name: Build APK
        env:
          HYPOLAB_STORE_PASSWORD: ${{ secrets.HYPOLAB_STORE_PASSWORD }}
        run: gradle -p android assembleRelease --stacktrace
      - name: Rename
        run: |
          V=$(grep versionName android/app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          cp android/app/build/outputs/apk/release/app-release.apk "hypolab-$V.apk"
          ls -la *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hypolab-apk
          path: hypolab-*.apk
          retention-days: 30
